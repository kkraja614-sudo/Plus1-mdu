async function leavePlan(id){await sb.from('plan_joins').delete().eq('plan_id',id).eq('user_id',me.id);render()}
async function setJoin(pid,uid,st){const{error}=await sb.from('plan_joins').update({status:st}).eq('plan_id',pid).eq('user_id',uid);toast(error?error.message:'Updated');render()}
async function delPlan(id){if(!confirm('Delete this plan?'))return;await sb.from('plans').delete().eq('id',id);render()}
function invite(){const t='Join me on Plus1 - find companions for movies, cafes and trips. Girls join free and you choose who you talk to.',u=location.origin+location.pathname;if(navigator.share)navigator.share({title:'Plus1',text:t,url:u}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(t+' '+u),'_blank')}
async function shrink(f,m){const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)});const k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.82))}
async function uploadSelfie(inp){
 const f=inp.files[0];if(!f)return;toast('Uploading...');
 try{const path=me.id+'/selfie.jpg',{error}=await sb.storage.from('verify').upload(path,await shrink(f,900),{upsert:true,contentType:'image/jpeg'});if(error)throw error;
 const{data,error:e2}=await sb.from('profiles').update({verify_path:path}).eq('id',me.id).select().single();if(e2)throw e2;mp=data;toast('Submitted for review');profile()}catch(e){toast(e.message||'Upload failed')}
}
async function viewSelfie(path){const w=window.open('','_blank');const{data,error}=await sb.storage.from('verify').createSignedUrl(path,300);if(error||!data){if(w)w.close();return toast(error?.message||'Cannot open')}if(w)w.location=data.signedUrl}
async function verifyUser(id,ok){const{error}=await sb.from('profiles').update(ok?{verified:true}:{verify_path:null}).eq('id',id);toast(error?error.message:ok?'Verified':'Rejected');render()}
let AP={};
const IFEE=199,STL={pending:'Verifying payment',sent:'Waiting for her reply',accepted:'Contact shared',declined:'Declined, credit added',expired:'No reply, credit added',rejected:'Payment not found'};let introWith=null;
function openIntro(id){introWith=id;go('intro')}
async function intro(){
 const{data:o}=await sb.from('profiles').select('name,age,city,avatar_url,verified').eq('id',introWith).maybeSingle(),cr=mp?.intro_credits||0,n=esc(o?.name);
 content.innerHTML=`<button class="small-link" onclick="go('discover')">← Back</button><div class="eyebrow">INTRO REQUEST</div><h1>Connect with ${n}</h1><div class="panel"><div class="match-row" style="border:0;padding:0"><div class="round">${av(o?.avatar_url,'◉')}</div><div class="rowcopy"><strong>${n}${o?.verified?' ✓':''}</strong><span>${o?.age||''} · ${esc(o?.city)}</span></div></div></div>
 <div class="panel"><strong>How it works</strong><p style="margin:6px 0 0;line-height:1.7">Pay the ₹${IFEE} intro fee.<br>We send your request to ${n}.<br>If she accepts, she shares her contact with you.<br>If she declines or does not reply in 24 hours, ₹${IFEE} returns as credit.</p></div>
 ${cr?`<button class="btn primary" style="width:100%;margin-bottom:10px" onclick="useCredit()">Use 1 credit (you have ${cr})</button>`:''}
 <div class="panel"><strong>UPI ID: ${UPI_ID}</strong><p style="margin:6px 0 0">Amount: ₹${IFEE}</p><a class="btn primary" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="upi://pay?pa=${UPI_ID}&pn=Plus1&am=${IFEE}&cu=INR">Pay with UPI app</a></div>
 <div class="field"><label>UPI reference / UTR number</label><input id="iutr" inputmode="numeric"></div><button class="btn primary" style="width:100%" onclick="submitIntro()">I have paid</button>`;
}
async function submitIntro(){const u=$('iutr').value.trim();if(!u)return toast('Enter the UTR number');const{error}=await sb.from('intro_requests').insert({payer_id:me.id,girl_id:introWith,utr:u,status:'pending'});toast(error?error.message:'Submitted. We will verify your payment');if(!error)go('intros')}
async function useCredit(){const{data}=await sb.rpc('intro_with_credit',{g:introWith});if(!data)return toast('No credit left');mp.intro_credits--;toast('Request sent');go('intros')}
async function setOpen(v){const{data,error}=await sb.from('profiles').update({open_to_intros:v}).eq('id',me.id).select().single();if(error)return toast(error.message);mp=data;toast(v?'Intro requests on':'Intro requests off')}
async function markIntro(id,st){const u={status:st};if(st==='sent')u.sent_at=new Date().toISOString();const{error}=await sb.from('intro_requests').update(u).eq('id',id);toast(error?error.message:st==='sent'?'Sent to her':'Rejected');render()}
async function introAns(id,ok){let u={status:'declined',responded_at:new Date().toISOString()};if(ok){const t=$('sh_'+id).value,v=$('cv_'+id).value.trim();if(!v)return toast('Enter your '+t);u={status:'accepted',contact_type:t,contact_value:v,responded_at:u.responded_at}}const{error}=await sb.from('intro_requests').update(u).eq('id',id);toast(error?error.message:ok?'Contact shared':'Declined');render()}
function tracker(r,who,p){
 const st=r.status,n=esc(p.name||'her'),ok=['sent','accepted','declined','expired'].includes(st),bad=st==='declined'||st==='expired',left=Math.max(0,Math.ceil(24-(Date.now()-new Date(r.sent_at))/36e5));
 const L=(m,t,d)=>`<div style="display:flex;gap:10px;margin:8px 0"><b style="width:18px;color:${m==='✓'?'var(--green)':m==='●'?'var(--pink)':'var(--muted)'}">${m}</b><div><div style="font-size:13px;font-weight:700">${t}</div>${d?`<div style="font-size:11px;color:var(--muted)">${d}</div>`:''}</div></div>`;
 const steps=st==='rejected'?L('✕','Payment not found','Check your UTR and try again'):L(ok?'✓':'●','Fee paid',ok?'₹'+IFEE+' verified':'Verifying payment')+L(ok?'✓':'○','Request sent to '+n,'')+L(st==='sent'?'●':st==='accepted'?'✓':bad?'✕':'○',bad?(st==='declined'?'She declined':'No reply in 24 hours'):'Waiting for her reply',st==='sent'?'About '+left+' hours left':'')+L(st==='accepted'?'✓':'○',st==='accepted'?'Contact shared':bad?'₹'+IFEE+' added as credit':'Contact shared','');
 return`<div class="panel"><div class="rowcopy">${who}</div><div style="margin-top:8px">${steps}</div>${st==='accepted'?`<div class="panel" style="margin:6px 0 0">${esc(r.contact_type)}: <b>${esc(r.contact_value)}</b></div>`:''}</div>`}
async function intros(){
 const girl=mp?.gender==='Female',load=async()=>(await sb.from('intro_requests').select('*').order('created_at',{ascending:false})).data||[];
 let rs=await load();const old=rs.filter(r=>r.status==='sent'&&Date.now()-new Date(r.sent_at)>864e5);
 if(old.length){await Promise.all(old.map(r=>sb.rpc('expire_intro',{rid:r.id})));rs=await load();const{data:m}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();if(m)mp=m}
 rs=rs.filter(r=>girl?r.girl_id===me.id&&r.status!=='pending'&&r.status!=='rejected':r.payer_id===me.id);
 const ids=[...new Set(rs.map(r=>girl?r.payer_id:r.girl_id))],{data:ps}=ids.length?await sb.from('profiles').select('id,name,age,city,verified').in('id',ids):{data:[]},P=Object.fromEntries((ps||[]).map(p=>[p.id,p]));
 const row=r=>{const p=P[girl?r.payer_id:r.girl_id]||{},who=`<strong>${esc(p.name||'Member')}${p.verified?' ✓':''}</strong><span>${p.age?p.age+' · ':''}${esc(p.city||'')}</span>`;
  if(girl&&r.status==='sent')return`<div class="panel"><div class="rowcopy">${who}</div><p style="margin:8px 0">Wants to connect. Your contact is shared only if you accept.</p><div class="grid2"><div class="field"><label>Share my</label><select id="sh_${r.id}"><option>Instagram</option><option>WhatsApp</option></select></div><div class="field"><label>ID or number</label><input id="cv_${r.id}"></div></div><div class="actions"><button class="btn primary" onclick="introAns('${r.id}',true)">Accept</button><button class="btn secondary" onclick="introAns('${r.id}',false)">Decline</button></div></div>`;
  if(!girl)return tracker(r,who,p);
  const c=!girl&&r.status==='accepted'?`<p style="margin:8px 0 0;color:var(--ink)">${esc(r.contact_type)}: <b>${esc(r.contact_value)}</b></p>`:'';
  return`<div class="panel"><div class="rowcopy">${who}</div><span class="pill" style="display:inline-block;margin-top:8px">${girl&&r.status==='accepted'?'You shared '+esc(r.contact_type):STL[r.status]||r.status}</span>${c}</div>`};
 content.innerHTML=`<button class="small-link" onclick="go('matches')">← Back</button><div class="eyebrow">INTRO REQUESTS</div><h1>${girl?'Requests for you':'Your requests'}</h1>${girl?'':`<p>Credits: ${mp?.intro_credits||0}</p>`}${rs.map(row).join('')||'<div class="panel">Nothing here yet.</div>'}`;
}
const REASONS=['No photo or photo is not clear','Photo looks fake or taken from the internet','Selfie does not match profile photo','Profile is incomplete (bio, age, city)','Inappropriate content','Other'];
function openReview(id){
 const p=AP[id];if(!p)return;
 const rows=[['City',p.city],['Gender',p.gender],['Interested in',p.interested_in],['Looking for',p.looking_for],['Phone',p.phone],['Bio',p.bio||'Not filled'],['Activities',(p.tags||[]).join(', ')],['Photo',p.avatar_url?'Uploaded':'None'],['Selfie',p.verify_path?'Submitted':'Not submitted']];
 const o=document.createElement('div');o.id='rv';o.className='rv';
 o.innerHTML=`<div class="rvp"><div class="section-head" style="margin-top:0"><h2>${esc(p.name)}, ${p.age}</h2><button class="small-link" onclick="closeReview()">Close</button></div>
 ${p.avatar_url?`<img class="rvimg" src="${esc(p.avatar_url)}" alt="">`:'<div class="panel">No profile photo uploaded.</div>'}
 ${p.verify_path?`<button class="btn secondary" style="width:100%;margin-top:10px" onclick="viewSelfie('${esc(p.verify_path)}')">View selfie</button>`:''}
 <div class="panel">${rows.map(r=>`<div class="rvrow"><span>${r[0]}</span><b>${esc(r[1]||'—')}</b></div>`).join('')}</div>
 <div class="panel"><strong>Check before approving</strong>${['Photo is clear and shows one real person','Selfie matches the profile photo','Reverse image search is clean'].map(t=>`<label class="rvchk"><input type="checkbox" onchange="rvGate()"> ${t}</label>`).join('')}</div>
 <button class="btn primary" id="rvOk" style="width:100%" disabled onclick="rvDo('${p.id}','approve')">Approve</button>
 <div class="grid2" style="margin-top:10px"><button class="btn secondary" onclick="rvShow('rvNeed')">Ask for changes</button><button class="btn secondary" onclick="rvShow('rvRej')">Reject</button></div>
 <div class="panel hidden" id="rvNeed"><div class="field"><label>What should the user fix? (user will see this)</label><textarea id="rvNote" rows="3"></textarea></div><button class="btn primary" style="width:100%" onclick="rvDo('${p.id}','needs_changes')">Send request</button></div>
 <div class="panel hidden" id="rvRej"><div class="field"><label>Reason</label><select id="rvReason"><option value="">Select a reason</option>${REASONS.map(r=>`<option>${r}</option>`).join('')}</select></div><div class="field"><label>Note (required for Other)</label><textarea id="rvRN" rows="2"></textarea></div><button class="btn primary" style="width:100%;background:#ff6b6b" onclick="rvDo('${p.id}','rejected')">Confirm reject</button></div></div>`;
 o.onclick=e=>{if(e.target===o)closeReview()};document.body.append(o);
}
function closeReview(){const o=$('rv');if(o)o.remove()}
function rvGate(){$('rvOk').disabled=![...document.querySelectorAll('#rv input[type=checkbox]')].every(c=>c.checked)}
function rvShow(id){['rvNeed','rvRej'].forEach(x=>$(x).classList.toggle('hidden',x!==id||!$(x).classList.contains('hidden')))}
async function rvDo(id,act){
 let u,m;
 if(act==='approve'){u={approved:true,review_status:null,review_note:null};m='Approved'}
 else if(act==='needs_changes'){const n=$('rvNote').value.trim();if(!n)return toast('Write what to fix');u={review_status:'needs_changes',review_note:n};m='Request sent'}
 else{const r=$('rvReason').value,n=$('rvRN').value.trim();if(!r)return toast('Select a reason');if(r==='Other'&&!n)return toast('Add a note for Other');u={review_status:'rejected',review_note:n?r+': '+n:r};m='Rejected'}
 const{error}=await sb.from('profiles').update(u).eq('id',id);
 if(error)return toast(error.message);
 closeReview();toast(m);render();
}
const reviewPanel=p=>p?.review_status?`<div class="panel"><strong>${p.review_status==='rejected'?'Profile was rejected':'Changes needed'}</strong><p style="margin:6px 0 10px">${esc(p.review_note)}</p><button class="btn primary" style="width:100%" onclick="resubmit()">I fixed it, resubmit</button></div>`:'';
async function resubmit(){const{data,error}=await sb.from('profiles').update({review_status:null,review_note:null}).eq('id',me.id).select().single();if(error)return toast(error.message);mp=data;toast('Sent for review again');render()}
async function approve(id){const{error}=await sb.from('profiles').update({approved:true}).eq('id',id);toast(error?error.message:'Approved');render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
sb.auth.onAuthStateChange((_,s)=>{if((s?.user?.id||null)!==(me?.id||null))setUser(s?.user)});
setInterval(()=>{if(me)updateBadge()},30000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
sb.auth.getSession().then(({data})=>setUser(data.session?.user));
</script>
</body></html>
